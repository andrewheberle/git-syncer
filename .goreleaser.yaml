version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: default
    main: ./cmd/git-syncer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - linux
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.Date={{ .CommitDate }} -X main.Version={{ .Version }}

archives:
  - ids:
      - default
    allow_different_binary_count: true
    formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  use: github-native

checksum:
  name_template: "checksums.txt"

release:
  draft: false
  make_latest: true
  replace_existing_artifacts: true
  prerelease: auto

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

nfpms:
  - ids:
      - default
    package_name: git-syncer
    homepage: https://github.com/andrewheberle/git-syncer
    maintainer: Andrew Heberle <andrew.heberle@gmail.com>
    description: |-
      A tool that will sync a Git repository and run a command if a
      file filter (regexp) matches.

      Can optionally pull HTTP Git credentials from a remote Consul
      KV store.
    formats:
      - deb
    license: MIT
    section: admin
    mtime: "{{ .CommitDate }}"

sboms:
  - id: package
    artifacts: package
    disable: false
  - artifacts: archive
    disable: false
